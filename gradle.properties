org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# 依赖全部走阿里云国内镜像，直连即可，**不要**设全局代理
# （之前踩过：设了全局代理会把阿里云也绕进 VPN，国内站点反而变慢，
#   表现就是 POM 能下、大 JAR 卡死）
# 网络超时调短一点，万一要回落到 google()/mavenCentral() 也不会长时间挂住
systemProp.org.gradle.internal.http.connectionTimeout=12000
systemProp.org.gradle.internal.http.socketTimeout=25000
